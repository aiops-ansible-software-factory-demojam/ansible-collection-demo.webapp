---
- name: configure | Create the document root
  ansible.builtin.file:
    path: "{{ nginx_docroot }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: configure | Install the configured index page
  when: nginx_index_content | length > 0
  ansible.builtin.copy:
    dest: "{{ nginx_docroot }}/index.html"
    content: "{{ nginx_index_content }}"
    owner: root
    group: root
    mode: '0644'

- name: configure | Install and validate the nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/nginx -t -c %s
  notify: Reload nginx
