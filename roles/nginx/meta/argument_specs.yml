---
argument_specs:
  main:
    short_description: Install and manage Enterprise Linux nginx
    description:
      - Installs the distribution nginx package, renders the main nginx.conf from the role template, validates with nginx -t, and reloads on change.
      - Uses the package nginx worker account; does not configure SELinux, firewalls, or TLS.
    author:
      - ansible software factory demojam
    options:
      nginx_docroot:
        description: Absolute document root path for the managed server block; must not contain parent-directory traversal segments.
        type: path
        default: /usr/share/nginx/html
      nginx_index_content:
        description: When non-empty, writes this content to index.html under the document root; empty leaves existing content unchanged.
        type: str
        default: ''
      nginx_listen_port:
        description: TCP port for the managed HTTP listener (1 through 65535).
        type: int
        default: 80
      nginx_service_enabled:
        description: Whether nginx is enabled at boot; the role always ensures the service is started.
        type: bool
        default: true
