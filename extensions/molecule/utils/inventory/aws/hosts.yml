---
all:
  children:
    molecule:
      hosts:
        rhel9:
          mp:
            aws:
              image_id: "{{ lookup('ansible.builtin.env', 'MOLECULE_AWS_RHEL9_AMI_ID') }}"
              root_volume_size: "{{ lookup('ansible.builtin.env', 'MOLECULE_AWS_ROOT_VOLUME_SIZE', default='30') | int }}"
          molecule_expected_distribution: RedHat
          molecule_expected_distribution_major_version: "9"
        rhel10:
          mp:
            aws:
              image_id: "{{ lookup('ansible.builtin.env', 'MOLECULE_AWS_RHEL10_AMI_ID') }}"
              root_volume_size: "{{ lookup('ansible.builtin.env', 'MOLECULE_AWS_ROOT_VOLUME_SIZE', default='30') | int }}"
          molecule_expected_distribution: RedHat
          molecule_expected_distribution_major_version: "10"
