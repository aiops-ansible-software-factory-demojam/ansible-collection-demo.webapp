---
- name: verify | Verify the test hosts
  ansible.builtin.import_playbook: ../utils/playbooks/verify.yml

- name: verify | Verify nginx serves HTTP with its package worker account
  hosts: molecule
  become: true
  gather_facts: false
  vars:
    nginx_docroot: /web
    nginx_index_content: "<h1>demojam demo</h1>\n"
  tasks:
    - name: verify | Read the guest SELinux mode
      ansible.builtin.command: getenforce
      register: nginx_selinux_mode
      changed_when: false

    - name: verify | Require nginx to work with SELinux enforcing
      ansible.builtin.assert:
        that: nginx_selinux_mode.stdout | trim == 'Enforcing'
        fail_msg: The collection must preserve enforcing mode while serving HTTP.

    - name: verify | Request the nginx home page
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
        return_content: true
      register: nginx_http
      until: nginx_http.status == 200
      retries: 6
      delay: 2

    - name: verify | Require the configured application page
      ansible.builtin.assert:
        that: nginx_index_content in nginx_http.content

    - name: verify | Read nginx process users
      ansible.builtin.command:
        argv:
          - ps
          - -o
          - user=
          - -C
          - nginx
      register: nginx_process_users
      changed_when: false

    - name: verify | Require a worker running as the package nginx account
      ansible.builtin.assert:
        that:
          - "'nginx' in nginx_process_users.stdout_lines | map('trim') | list"
        fail_msg: nginx must serve HTTP with a worker running as the nginx account.
