---
- name: Observe SELinux after applying the reviewed fix
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - selinux
- name: Require enforcing SELinux rather than hiding the fault
  ansible.builtin.assert:
    that:
      - ansible_facts.selinux.status == 'enabled'
      - ansible_facts.selinux.mode == 'enforcing'
- name: Read the actual web application response after handlers finish
  when: not ansible_check_mode
  ansible.builtin.uri:
    url: 'http://127.0.0.1:{{ nginx_listen_port | default(80) }}/'
    return_content: true
    status_code: 200
  register: webapp_promotion_http
  until: webapp_promotion_http.status | default(0) == 200
  retries: 12
  delay: 5
- name: Require the configured application page
  when: not ansible_check_mode
  ansible.builtin.assert:
    that: nginx_index_content in webapp_promotion_http.content
- name: Publish verified recovery from this exact collection source
  when: not ansible_check_mode
  ansible.builtin.set_stats:
    aggregate: false
    data:
      webapp_release_contract: '{{ webapp_release_contract }}'
      webapp_deployment_evidence:
        source_revision: '{{ awx_project_revision }}'
        selinux: enforcing
        http_status: '{{ webapp_promotion_http.status }}'
        content_sha256: '{{ webapp_promotion_http.content | hash("sha256") }}'
        passed: true
- name: Publish each verified web host without hiding an incomplete rollout
  when: not ansible_check_mode
  ansible.builtin.set_stats:
    data:
      webapp_deployment_hosts: >-
        {{ {inventory_hostname: {'source_revision': awx_project_revision, 'passed': true,
        'selinux': 'enforcing', 'http_status': webapp_promotion_http.status}} }}
