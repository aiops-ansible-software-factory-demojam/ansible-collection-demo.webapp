---
- name: deploy_webapp | Deploy the nginx demo application from vars
  hosts: "{{ webapp_target_group | default('webapps') }}"
  become: true
  gather_facts: false
  vars:
    # /web intentionally lacks persistent SELinux policy in the demo baseline.
    nginx_docroot: /web
    nginx_index_content: "<h1>demojam demo</h1>\n"
  roles:
    - role: demo.webapp.nginx
  post_tasks:
    - name: deploy_webapp | Verify the application response after configuration handlers
      when: not ansible_check_mode
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ nginx_listen_port | default(80) }}/"
        status_code: 200
      register: __webapp_http
      until: __webapp_http.status | default(0) == 200
      retries: 12
      delay: 5
