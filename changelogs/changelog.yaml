---
ancestor: null
releases:
  1.0.0:
    changes:
      doc_changes:
        - Align task naming with strict ansible-lint production profile.
      minor_changes:
        - Bump collection version to 1.0.0 for Galaxy metadata compliance.
    fragments: []
  0.1.0:
    changes:
      breaking_changes:
        - >-
          The nginx role defaults to the package document root and leaves index content
          alone. Use playbooks/deploy_webapp.yml to load the demo settings from vars/webapp.yml.
      minor_changes:
        - Validate templated nginx configuration before replacement and reload only on changes.
        - Make configuration and service tasks safe after simulated package installation in fresh-host check mode.
        - Validate and document the complete nginx role input contract.
        - Use the same collection deployment playbook in production and Molecule, and verify the configured page content.
        - >-
          Molecule - adopted the published 0.0.7-alpha AWS inventory contract with explicit network,
          shared security group, account, disk and deployment-tag settings.
        - Select AWS or KubeVirt Molecule guests from the sandbox environment and run every scenario with make molecule.
        - Rename the demo collection to demo.webapp and adopt the collection golden-path layout.
        - Keep the nginx role with demo settings in vars/webapp.yml and playbooks/deploy_webapp.yml.
        - Add shared Molecule lifecycle under extensions/molecule/ with AWS RHEL 9/10 and KubeVirt CentOS Stream 10 scenarios.
        - Ship collections/requirements.yml for the pinned Molecule provisioner used in lint and tests.
      bugfixes:
        - Exclude generated collection caches from Git and collection artifacts so local installation links cannot enter a remediation release.
        - Pass Molecule's scenario name to the shared create playbook for both guest backends.
    fragments:
      - aws-tests.yml
      - molecule-scenario-name.yml
      - nginx-good-practices.yml
      - portable-collection-artifacts.yml
      - published-aws-provisioner.yml
